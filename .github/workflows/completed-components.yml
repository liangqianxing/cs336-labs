name: Completed components

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  completed-components:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.0'
          python-version: '3.12'
          enable-cache: true
          cache-dependency-glob: assignment1-basics/uv.lock
      - name: Verify the eight tests for seven completed component groups
        run: bash scripts/check_completed.sh
